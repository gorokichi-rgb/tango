<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>単語アプリ</title>
<meta name="theme-color" content="#E5E5E5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="単語">

<style>
*{box-sizing:border-box}
body{margin:0;background:#E5E5E5;color:#000;font-family:system-ui,'Noto Sans JP',sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px 0}
button,input,textarea{font:inherit;color:#000}
button{cursor:pointer;white-space:nowrap;overflow:hidden}
button:disabled{opacity:.4;cursor:default}
.b{border:1px solid #000;border-radius:12px;background:#E5E5E5}
.on{background:#A499C9!important}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;font-size:18px;flex:none}
.sm{padding:6px 14px}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar button{flex:1;padding:10px 0;font-size:13px}
.row{display:flex;align-items:center;margin-bottom:12px}.row .b{flex:1;padding:18px 16px;font-size:16px;text-align:left}
.rk{width:48px;text-align:center;font-size:32px;font-weight:700}
.mu{font-size:14px;margin:24px 0}
.nav{margin-top:auto;position:sticky;bottom:0;background:#E5E5E5;display:flex;gap:8px;padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
.nav button{flex:1;padding:14px 0;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk{text-align:center;font-size:12px;padding:6px 0}
.day{height:62px;border:1px solid #000;border-radius:8px;padding:4px;font-size:12px}
.card{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;white-space:normal}
.card p{margin:0}.ex{font-size:12px;margin-top:6px!important}
.big{font-size:24px;margin-bottom:8px!important}
.gap{height:16px}
label{display:block;font-size:13px;margin-bottom:14px}
.in{display:block;width:100%;margin-top:6px;padding:12px;font-size:16px}
.full{width:100%;padding:16px;margin-bottom:10px;font-size:16px}
.up{min-height:36px;margin:0 0 20px!important}
.fc{width:100%;height:300px;font-size:34px;border-radius:20px;white-space:normal}
.pn{display:flex;justify-content:space-between;margin-top:20px}.pn button{padding:12px 36px;font-size:18px}
.tb{display:flex;align-items:center;gap:12px;margin-top:24px}
.bar2{flex:1;height:12px;border:1px solid #000;border-radius:6px;overflow:hidden}
#fill{height:100%;width:100%;background:#A499C9}
.tb span{font-size:14px}
.tw{font-size:38px;text-align:center;margin:48px 0;word-break:break-word}
.ch{width:100%;padding:16px;margin-bottom:10px;font-size:16px}
.res{padding:32px;text-align:center;margin-bottom:16px}.res .n{font-size:48px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:24px}
#md>div{width:100%;max-width:360px;padding:16px}
</style></head><body><div id="app"></div>
<script>
const A='#A499C9',K='tango_app_v1';
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!D||!D.folders)D={folders:[],log:{},rank:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const p2=n=>String(n).padStart(2,'0');
const mark=()=>{const d=new Date();D.log[d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())]=1;save()};
const F=id=>D.folders.find(f=>f.id==id);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let cur={s:'home'},skip=false,cal=new Date(),desc=true,flip=false,pi=0,Q=null;
let st=[cur],hok=true;
try{history.replaceState(cur,'')}catch(e){hok=false}
function go(s,p={}){cur={s,...p};st.push(cur);if(hok)try{history.pushState(cur,'')}catch(e){hok=false}render()}
function rep(s,p={}){cur={s,...p};st[st.length-1]=cur;if(hok)try{history.replaceState(cur,'')}catch(e){hok=false}render()}
function pop(){if(st.length>1)st.pop();cur=st[st.length-1];render()}
function goBack(){if(hok){skip=true;history.back()}else pop()}
window.onpopstate=e=>{
 if((cur.s=='test'||cur.s=='practice')&&!skip){try{history.pushState(cur,'')}catch(x){}dlg('やめますか？（記録は残りません）',{ok:'やめる'},goBack);return}
 skip=false;pop()};
const closeX=()=>goBack();
const nav=on=>'<div class="nav">'+[['list','一覧'],['pick','暗記'],['tpick','テスト']].map(([s,t])=>`<button class="b${on==s?' on':''}" data-a="tab" data-s="${s}">${t}</button>`).join('')+'</div>';
const empty='<p class="mu">フォルダがありません。「一覧」で作成してください。</p>';

function home(){const y=cal.getFullYear(),m=cal.getMonth(),n=new Date(y,m+1,0).getDate(),o=(new Date(y,m,1).getDay()+6)%7;
 let g='月火水木金土日'.split('').map(x=>`<div class="wk">${x}</div>`).join('')+'<div></div>'.repeat(o);
 for(let d=1;d<=n;d++){const k=y+'-'+p2(m+1)+'-'+p2(d);g+=`<div class="day${D.log[k]?' on':''}">${d}</div>`}
 return `<div class="top"><button class="b sm" data-a="mo" data-d="-1" aria-label="前の月">&lt;</button><span>${y}年${m+1}月</span><button class="b sm" data-a="mo" data-d="1" aria-label="次の月">&gt;</button></div><div class="cal">${g}</div>`+nav('')}
function list(){return `<div class="top"><span>一覧</span><button class="b sm" data-a="addf">＋ フォルダ</button></div><div class="bar"><button class="b" data-a="imp">インポート</button><button class="b" data-a="exp">エクスポート</button><button class="b" data-a="rst">初期化</button></div>`+(D.folders.map(f=>`<div class="row"><button class="b" data-a="open" data-f="${f.id}">${esc(f.name)}</button></div>`).join('')||'<p class="mu">フォルダがありません</p>')+nav('list')}
function words(){const f=F(cur.f);if(!f)return list();let w=[...f.words];if(desc)w.reverse();
 return `<div class="top"><span>${esc(f.name)}</span><button class="b sm" data-a="ord" aria-label="並び替え">${desc?'↓':'↑'}</button></div><div class="bar"><button class="b" data-a="addw" title="Ctrl+A">＋ 単語</button><button class="b" data-a="renf">名前変更</button><button class="b" data-a="delf">削除</button></div>`+(w.map(x=>`<button class="b card" data-a="det" data-w="${x.id}"><p>${esc(x.f)} → ${esc(x.b)}</p>${x.e?`<p class="ex">${esc(x.e)}</p>`:''}</button>`).join('')||'<p class="mu">単語がありません</p>')+nav('list')}
function det(){const f=F(cur.f),x=f&&f.words.find(w=>w.id==cur.w);if(!x)return list();
 return `<div class="top"><span>${esc(f.name)}</span></div><div class="b card"><p class="big">${esc(x.f)}</p><p>${esc(x.b)}</p><div class="gap"></div><p class="ex">${esc(x.e)}</p></div><div class="bar"><button class="b" data-a="edw">編集</button><button class="b" data-a="delw">削除</button></div>`+nav('list')}
function form(){const f=F(cur.f),x=(cur.w&&f.words.find(w=>w.id==cur.w))||{};
 return `<div class="top"><span>${cur.w?'編集':'単語を追加'}</span></div><label>表<input id="i1" class="b in" value="${esc(x.f)}"></label><label>裏<input id="i2" class="b in" value="${esc(x.b)}"></label><label>例文<textarea id="i3" class="b in" rows="3">${esc(x.e)}</textarea></label><button class="b full" data-a="savew" title="Ctrl+Enter">保存</button>`+nav('list')}
function pickS(test){return `<div class="top"><span>${test?'テスト':'暗記'}</span></div>`+(D.folders.map(f=>{const ok=test?f.words.length>=6:f.words.length>0,r=test?(D.rank[f.id]||''):'';
 return `<div class="row"><button class="b" data-a="${test?'tst':'prc'}" data-f="${f.id}"${ok?'':' disabled'}>${esc(f.name)}</button>${test?`<span class="rk"${r=='S'?` style="color:${A}"`:''}>${r}</span>`:''}</div>`}).join('')||empty)+nav(test?'tpick':'pick')}
function prac(){const f=F(cur.f),x=f&&f.words[pi];if(!x)return list();
 return `<div class="top"><button class="b sm" data-a="x" aria-label="閉じる">×</button><span></span></div><p class="ex up">${esc(x.e)}</p><button class="b fc" data-a="flip">${esc(flip?x.b:x.f)}</button><div class="pn"><button class="b" data-a="pv" aria-label="前へ">&lt;</button><button class="b" data-a="nx" aria-label="次へ">&gt;</button></div>`+nav('pick')}
function tstart(fid){const f=F(fid);
 Q={f:fid,i:0,pts:0,wr:[],qs:sh(f.words).slice(0,20).map(w=>{const o=[...new Set(sh(f.words.filter(x=>x.id!=w.id&&x.b!=w.b)).map(x=>x.b))].slice(0,5);return{w,ch:sh([w.b,...o])}})}}
function tst(){const q=Q.qs[Q.i];return `<div class="tb"><div class="bar2"><div id="fill"></div></div><span>${Q.i+1}/${Q.qs.length}</span></div><div class="tw">${esc(q.w.f)}</div>`+q.ch.map((c,i)=>`<button class="b ch" data-a="ans" data-i="${i}"><span>${esc(c)}</span></button>`).join('')+'<button class="b ch" data-a="skip">スキップ</button>'}
function ans(i){const q=Q.qs[Q.i];if(i>=0&&q.ch[i]==q.w.b)Q.pts+=Date.now()-Q.t0<=6000?5:4;else Q.wr.push(q.w);Q.i++;Q.i>=Q.qs.length?fin():render()}
function fin(){const sc=Math.floor(Q.pts/(Q.qs.length*5)*100),r=sc>=100?'S':sc>=81?'A':sc>=71?'B':sc>=61?'C':'D';D.rank[Q.f]=r;mark();save();Q.sc=sc;Q.r=r;rep('result')}
function result(){return `<div class="top"><span>結果</span></div><div class="b res"><div>点数</div><div class="n">${Q.sc}/100</div><div style="margin-top:16px">ランク</div><div class="n"${Q.r=='S'?` style="color:${A}"`:''}>${Q.r}</div></div><button class="b full" data-a="wr">間違えた単語</button><button class="b full" data-a="again">もう一度</button>`}
function wrong(){return `<div class="top"><span>間違えた単語</span></div>`+(Q.wr.map(w=>`<div class="b card"><p>${esc(w.f)} → ${esc(w.b)}</p></div>`).join('')||'<p class="mu">間違えた単語はありません</p>')}
const S={home,list,words,det,form,pick:()=>pickS(0),tpick:()=>pickS(1),practice:prac,test:tst,result,wrong};
function render(){$('#app').innerHTML=(!hok&&st.length>1?'<button class="b sm" data-a="bk" style="align-self:flex-start;margin-top:8px">‹ 戻る</button>':'')+(S[cur.s]||home)();scrollTo(0,0);if(cur.s=='form')$('#i1').focus();
 if(cur.s=='test'){Q.t0=Date.now();const f=$('#fill');f.getBoundingClientRect();f.style.transition='width 6s linear';f.style.width='0';
  document.querySelectorAll('.ch span').forEach(s=>{const b=s.parentNode;let z=16;while(s.getBoundingClientRect().width>b.clientWidth-34&&z>7){z--;s.style.fontSize=z+'px'}})}}
function dlg(msg,o,cb){
 const m=document.createElement('div');m.id='md';
 m.innerHTML=`<div class="b"><p style="margin:0 0 14px;font-size:15px">${esc(msg)}</p>${o.input?`<input id="di" class="b in" value="${esc(o.val||'')}" style="margin:0 0 14px">`:''}<div class="bar" style="margin:0">${o.cancel===false?'':'<button class="b" id="dn">キャンセル</button>'}<button class="b on" id="dy">${o.ok||'OK'}</button></div></div>`;
 document.body.appendChild(m);
 const close=()=>m.remove(),i=m.querySelector('#di'),n=m.querySelector('#dn');
 m.querySelector('#dy').onclick=()=>{const v=i?i.value:true;close();cb&&cb(v)};
 if(n)n.onclick=close;
 m.onclick=e=>{if(e.target==m&&n)close()};
 if(i){i.focus();i.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();m.querySelector('#dy').click()}}}}
function modal(h){const m=document.createElement('div');m.id='md';m.innerHTML=`<div class="b">${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m)}
function dl(id){const fs=id=='all'?D.folders:D.folders.filter(f=>f.id==id);
 const b=new Blob([JSON.stringify({folders:fs.map(f=>({name:f.name,words:f.words.map(w=>({f:w.f,b:w.b,e:w.e}))}))})],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(id=='all'?'tango-all':'tango-'+fs[0].name)+'.json';a.click();$('#md')?.remove()}
function imp(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{(JSON.parse(r.result).folders||[]).forEach(f=>{let n=f.name,k=0;while(D.folders.some(x=>x.name==n))n=f.name+' ('+(++k)+')';
  D.folders.push({id:uid(),name:n,words:(f.words||[]).map(w=>({id:uid(),f:w.f,b:w.b,e:w.e||''}))})});save();render()}catch(x){dlg('読み込めませんでした',{cancel:false})}};r.readAsText(i.files[0])};i.click()}
$('#app').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,d=b.dataset;
 if(a=='tab')(cur.s=='home'?go:rep)(d.s);
 else if(a=='mo'){cal=new Date(cal.getFullYear(),cal.getMonth()+ +d.d,1);render()}
 else if(a=='addf')dlg('フォルダ名',{input:1,ok:'追加'},n=>{if(n.trim()){D.folders.push({id:uid(),name:n.trim(),words:[]});save();render()}});
 else if(a=='open')go('words',{f:d.f});
 else if(a=='ord'){desc=!desc;render()}
 else if(a=='addw')go('form',{f:cur.f});
 else if(a=='det')go('det',{f:cur.f,w:d.w});
 else if(a=='edw')go('form',{f:cur.f,w:cur.w});
 else if(a=='savew'){const f=F(cur.f),x=$('#i1').value.trim(),y=$('#i2').value.trim(),z=$('#i3').value.trim();if(!x||!y){dlg('表と裏を入力してください',{cancel:false});return}
  if(cur.w){const w=f.words.find(w=>w.id==cur.w);w.f=x;w.b=y;w.e=z}else f.words.push({id:uid(),f:x,b:y,e:z});save();goBack()}
 else if(a=='delw')dlg('この単語を削除しますか？',{ok:'削除'},()=>{const f=F(cur.f);f.words=f.words.filter(w=>w.id!=cur.w);save();goBack()});
 else if(a=='renf'){const f=F(cur.f);dlg('フォルダ名',{input:1,val:f.name,ok:'変更'},n=>{if(n.trim()){f.name=n.trim();save();render()}})}
 else if(a=='delf')dlg('このフォルダと中の単語を削除しますか？',{ok:'削除'},()=>{D.folders=D.folders.filter(f=>f.id!=cur.f);delete D.rank[cur.f];save();goBack()});
 else if(a=='rst')dlg('すべてのデータを消します。よろしいですか？',{ok:'初期化'},()=>{D={folders:[],log:{},rank:{}};save();render()});
 else if(a=='imp')imp();
 else if(a=='exp')modal('<button class="b full" data-a="dl" data-f="all">すべて</button>'+D.folders.map(f=>`<button class="b full" data-a="dl" data-f="${f.id}">${esc(f.name)}</button>`).join(''));
 else if(a=='prc'){pi=0;flip=false;mark();go('practice',{f:d.f})}
 else if(a=='x')closeX();
 else if(a=='bk'){if(cur.s=='test'||cur.s=='practice')dlg('やめますか？（記録は残りません）',{ok:'やめる'},pop);else pop()}
 else if(a=='flip'){flip=!flip;render()}
 else if(a=='pv'){pi=Math.max(0,pi-1);flip=false;render()}
 else if(a=='nx'){pi=Math.min(F(cur.f).words.length-1,pi+1);flip=false;render()}
 else if(a=='tst'){tstart(d.f);go('test')}
 else if(a=='ans')ans(+d.i);
 else if(a=='skip')ans(-1);
 else if(a=='wr')go('wrong');
 else if(a=='again'){tstart(Q.f);rep('test')}};
document.addEventListener('click',e=>{const b=e.target.closest('#md [data-a=dl]');if(b)dl(b.dataset.f)});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key=='Enter'&&cur.s=='form'){e.preventDefault();$('[data-a=savew]').click();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='a'&&(cur.s=='words'||cur.s=='det')&&!$('#md')){
  const t=e.target.tagName;if(t=='INPUT'||t=='TEXTAREA')return;e.preventDefault();go('form',{f:cur.f})}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
